name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The claim this app makes to its users is only worth something if it is
      # checked. A build that can reach the network does not get released.
      - name: Offline audit
        run: npm run audit:offline

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the standalone offline build
        uses: actions/upload-artifact@v4
        with:
          name: CompareCode-offline
          path: dist/CompareCode.html
          if-no-files-found: error
